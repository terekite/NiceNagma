# `flutter create . ` preserves this file (it skips an existing pubspec). These
# are the deps the app actually imports today; add sqflite when the local nagma
# library lands.
name: nicenagma
description: Tabla lehra/nagma practice — human-sounding harmonium, machine-perfect laya.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0            # talk to the render service
  path_provider: ^2.1.0  # local cache dir for rendered loops
  crypto: ^3.0.3         # cache-key hashing, must match the server's key
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # The harmonium soundfont is bundled for on-device rendering (~5.6 MB). It is
  # materialized into app/assets/ from the canonical repo assets/ by bootstrap.sh
  # (git-ignored there to avoid duplicating it in the app package). Future
  # instruments are downloaded on demand, not bundled — see SoundfontProvider.
  assets:
    - assets/soundfonts/harmonium.sf2
