name: ci

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install core
        run: pip install -e ./core pytest
      - name: core tests
        run: cd core && pytest -q

  render-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: System deps (libsndfile)
        run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - name: Install core + render
        run: pip install -e ./core -e "./render[dev]"
      - name: render tests
        run: cd render && pytest -q

  smoke:
    # The primary correctness gate: text nagma -> score -> WAV, exact loop length.
    # fluidsynth is installed so the FULL pipeline (incl. WAV) runs whenever a
    # soundfont is present; without one the score stage still gates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: System deps (fluidsynth, libsndfile)
        run: sudo apt-get update && sudo apt-get install -y fluidsynth libsndfile1
      - name: Install packages
        run: pip install -e ./core -e "./render[dev]"
      - name: Smoke test
        run: ./scripts/smoke.sh
