[project]
name = "nagma-core"
version = "0.1.0"
description = "Pure domain logic for NiceNagma: taal defs, sargam parser, score compiler, performance model."
requires-python = ">=3.10"
dependencies = []  # intentionally zero runtime deps — pure stdlib

[project.scripts]
nagma-compile = "nagma_core.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nagma_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
