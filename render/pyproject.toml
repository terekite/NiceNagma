[project]
name = "nagma-render"
version = "0.1.0"
description = "The package that outputs the recording: sampler wrapper + loop mastering, CLI + HTTP service."
requires-python = ">=3.10"
dependencies = [
    "nagma-core",
    "mido>=1.3",
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# Better loudness normalization; falls back to peak-normalize if absent.
loudness = ["pyloudnorm>=0.1"]
# HTTP render service.
service = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=7", "pyloudnorm>=0.1"]

[project.scripts]
nagma-render = "nagma_render.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nagma_render"]

[tool.hatch.metadata]
# Allow the local path dependency on nagma-core in the uv workspace.
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
